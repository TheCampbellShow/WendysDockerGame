<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wendy's Docker Picking</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111}
#game{
  position:relative;width:100vw;height:100vh;min-height:560px;
  overflow:hidden;background:#222;
}
#scene{
  position:absolute;inset:0;
  background:url("kendal-game.png") center center/cover no-repeat;
  filter:saturate(1.05);
}
#darken{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.18));pointer-events:none}
#hud{
 position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;
 color:white;text-shadow:3px 3px #000;font-weight:900;z-index:20;pointer-events:none;
}
.box{font-size:clamp(16px,2.2vw,30px);line-height:1.05}
.box small{display:block;font-size:.48em}
#message{
 position:absolute;left:50%;bottom:18%;transform:translateX(-50%);
 background:#ff4f9a;color:white;border:4px solid #111;border-radius:14px;
 padding:10px 18px;font-size:clamp(16px,2.5vw,30px);font-weight:900;
 text-shadow:2px 2px #111;z-index:15;white-space:nowrap;box-shadow:0 5px 0 #111;
}
#player{
 position:absolute;z-index:10;left:8%;bottom:17%;width:150px;height:200px;
 background:url("wendy.png") center/contain no-repeat;
 transition:transform .08s linear;
 filter:drop-shadow(4px 5px 2px rgba(0,0,0,.5));
}
.item{
 position:absolute;z-index:8;width:54px;height:28px;cursor:pointer;
 background:linear-gradient(90deg,#fff 0 72%,#e49a32 73% 100%);
 border:3px solid #222;border-radius:14px;transform:rotate(-12deg);
 box-shadow:2px 3px 0 #111;
}
.item:after{content:"";position:absolute;right:-7px;top:3px;width:7px;height:16px;background:#f3a629;border:2px solid #222}
.item span{position:absolute;left:-12px;top:-17px;font-size:24px}
#sheep{position:absolute;z-index:9;font-size:72px;bottom:17%;left:65%;filter:drop-shadow(3px 4px 2px #222)}
#start{
 position:absolute;z-index:50;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
}
.card{
 background:#fff;border:6px solid #111;border-radius:25px;padding:28px;max-width:600px;width:90%;text-align:center;
 box-shadow:0 12px 0 #111;
}
.card h1{font-size:clamp(32px,7vw,70px);margin:0 0 8px;color:#ef4d96;text-shadow:3px 3px #111}
.card p{font-size:clamp(16px,3vw,25px);font-weight:800}
button{
 border:4px solid #111;border-radius:16px;background:#ffd21c;padding:14px 28px;
 font-size:clamp(20px,4vw,32px);font-weight:900;cursor:pointer;box-shadow:0 7px 0 #111;
}
button:active{transform:translateY(5px);box-shadow:0 2px 0 #111}
#mobile{
 position:absolute;z-index:30;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;
}
.controls{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:65px;height:65px;border-radius:50%;padding:0;background:white}
#win{display:none;position:absolute;z-index:60;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center}
.winCard{background:#fff;border:6px solid #111;border-radius:25px;padding:30px;text-align:center;max-width:560px;width:90%}
.winCard h2{font-size:45px;color:#ef4d96;margin:0 0 10px}
@media(max-width:700px){
 #player{width:115px;height:160px}
 #message{bottom:28%;font-size:18px}
 .item{width:44px;height:23px}
 #sheep{font-size:55px}
}
</style>
</head>
<body>
<div id="game">
  <div id="scene"></div><div id="darken"></div>

  <div id="hud">
    <div class="box">SCORE <span id="score">00000</span><small>DOCKERS COLLECTED: <span id="count">0</span>/15</small></div>
    <div class="box" style="text-align:right">❤️ ❤️ ❤️<small>WENDY'S MISSION</small></div>
  </div>

  <div id="player" aria-label="Wendy"></div>
  <div id="sheep">🐑</div>
  <div id="message">WENDY HAS FOUND A DOCKER! 😂</div>

  <div id="mobile">
    <div class="controls">
      <button class="ctrl" id="left">◀</button>
      <button class="ctrl" id="right">▶</button>
      <button class="ctrl" id="jump">⬆</button>
    </div>
  </div>

  <div id="start">
    <div class="card">
      <h1>WENDY'S<br>DOCKER PICKING</h1>
      <p>🏔️ Kendal, Cumbria's most important mission 🚬</p>
      <p>Help Wendy collect <b>15 Dockers</b> before the sheep get in her way!</p>
      <button id="startBtn">START PICKING 😂</button>
    </div>
  </div>

  <div id="win">
    <div class="winCard">
      <h2>WENDY DID IT! 🎉</h2>
      <p id="finalText"></p>
      <button onclick="location.reload()">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
const player=document.getElementById('player');
const scoreEl=document.getElementById('score');
const countEl=document.getElementById('count');
const msg=document.getElementById('message');
const start=document.getElementById('start');
const win=document.getElementById('win');
let x=8, y=0, score=0, count=0, running=false, jumping=false;
const keys={left:false,right:false};
const messages=[
 "WENDY HAS FOUND A DOCKER! 😂",
 "GET IN! ANOTHER ONE! 🚬",
 "WENDY IS ON A ROLL!",
 "KENDAL WILL BE EMPTY AT THIS RATE!",
 "THE DOCKER HAS BEEN SECURED. 😂",
 "DON'T LET THE SHEEP STEAL IT!"
];

function makeItems(){
  document.querySelectorAll('.item').forEach(e=>e.remove());
  for(let i=0;i<15;i++){
    const el=document.createElement('div');
    el.className='item';
    el.style.left=(12+Math.random()*78)+'%';
    el.style.bottom=(18+Math.random()*34)+'%';
    el.innerHTML='<span>💨</span>';
    el.dataset.got='0';
    document.getElementById('game').appendChild(el);
  }
}
function update(){
 if(!running)return;
 const speed=window.innerWidth<700?0.7:1.0;
 if(keys.left)x-=speed;
 if(keys.right)x+=speed;
 x=Math.max(2,Math.min(88,x));
 if(jumping){
   y+=0.8;
   if(y>=0){y=0;jumping=false}
 }
 player.style.left=x+'%';
 player.style.transform=`translateY(${-y*120}px)`;
 collect();
 requestAnimationFrame(update);
}
function collect(){
 const pr=player.getBoundingClientRect();
 document.querySelectorAll('.item').forEach(el=>{
   if(el.dataset.got==='1')return;
   const r=el.getBoundingClientRect();
   if(pr.right>r.left+5 && pr.left<r.right-5 && pr.bottom>r.top && pr.top<r.bottom){
     el.dataset.got='1'; el.style.display='none';
     count++; score+=10;
     scoreEl.textContent=String(score).padStart(5,'0');
     countEl.textContent=count;
     msg.textContent=messages[(count-1)%messages.length];
     if(count===15){
       running=false;
       setTimeout(()=>{
         document.getElementById('finalText').textContent=`Wendy collected all 15 Dockers and scored ${score} points. Kendal can finally breathe again. 😂`;
         win.style.display='flex';
       },500);
     }
   }
 })
}
function jump(){if(!jumping){jumping=true;y=-1.15}}
document.getElementById('startBtn').onclick=()=>{
 start.style.display='none'; running=true; makeItems(); update();
};
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
 if(e.key==='ArrowUp'||e.key===' ')jump();
});
document.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;
});
function hold(btn,key){
 btn.addEventListener('pointerdown',()=>keys[key]=true);
 btn.addEventListener('pointerup',()=>keys[key]=false);
 btn.addEventListener('pointerleave',()=>keys[key]=false);
}
hold(document.getElementById('left'),'left');
hold(document.getElementById('right'),'right');
document.getElementById('jump').addEventListener('pointerdown',jump);
</script>
</body>
</html>
